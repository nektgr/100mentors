services:
  postgres:
    image: postgres:15
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: microblog
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - microblog-network

  backend:
    build:
      context: ./microblog-backend
    ports:
      - '5000:5000'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/microblog
      JWT_SECRET: your-secret-key-change-in-production
      PORT: 5000
      FRONTEND_URL: "http://localhost:3000"
    volumes:
      - ./microblog-backend:/app
      - backend-node-modules:/app/node_modules
    networks:
      - microblog-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./microblog-front
    ports:
      - '3000:3000'
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000
    volumes:
      - ./microblog-front:/app
      - frontend-node-modules:/app/node_modules
    networks:
      - microblog-network

networks:
  microblog-network:
    driver: bridge

volumes:
  postgres-data:
  backend-node-modules:
  frontend-node-modules:
